<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
  font-family: system-ui;
  background: #0b0f14;
  color: white;
}

.stop {
  padding: 12px 0;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #00d2ff;
  font-weight: 600;
}

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://sweet-frost-f9aa.lupinesse.workers.dev";

const homeLat = 60.1896;
const homeLon = 24.9542;

let state = {
  lat: null,
  lon: null,
  stops: [],
  lastData: []
};

function getLocation() {
  document.getElementById("status").innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;

      loadNearbyStops();
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    },
    { enableHighAccuracy: true }
  );
}

async function loadNearbyStops() {

  document.getElementById("status").innerText = "Loading stops...";

  const query = `
    query {
      nearest(
        lat: ${state.lat},
        lon: ${state.lon},
        first: 10,
        maxDistance: 1000,
        filterByPlaceTypes: STOP
      ) {
        edges {
          node {
            place {
              ... on Stop {
                gtfsId
                name
                lat
                lon
                vehicleMode
                stoptimesWithoutPatterns(numberOfDepartures: 3) {
                  serviceDay
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                      mode
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  `;

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query })
  });

  const data = await res.json();

  state.stops = data.data.nearest.edges;

  render();
}


// 📍 distance helper
function meters(lat1, lon1, lat2, lon2) {
  return Math.sqrt(
    Math.pow(lat1 - lat2, 2) +
    Math.pow(lon1 - lon2, 2)
  ) * 111000;
}


// 🚇 MAIN RENDER
function render() {
  const container = document.getElementById("results");
  container.innerHTML = "";

  const now = Date.now();

  let stops = state.stops.map(edge => {
    const s = edge.node.place;

    const dist = Math.sqrt(
      Math.pow(state.lat - s.lat, 2) +
      Math.pow(state.lon - s.lon, 2)
    ) * 111000;

    const walkMin = Math.round(dist / 80);

    // 🧠 determine dominant mode from departures
    let modeCounts = {
      BUS: 0,
      TRAM: 0,
      RAIL: 0,
      SUBWAY: 0,
      UNKNOWN: 0
    };

    (s.stoptimesWithoutPatterns || []).forEach(dep => {
      const m = dep.trip?.route?.mode || "UNKNOWN";
      if (modeCounts[m] !== undefined) modeCounts[m]++;
      else modeCounts.UNKNOWN++;
    });

    let dominantMode = Object.keys(modeCounts).reduce((a, b) =>
      modeCounts[a] > modeCounts[b] ? a : b
    );

    let emoji = "🚏";

    if (dominantMode === "BUS") emoji = "🚌";
    if (dominantMode === "TRAM") emoji = "🚋";
    if (dominantMode === "RAIL") emoji = "🚆";
    if (dominantMode === "SUBWAY") emoji = "🚇";

    return {
      name: s.name,
      emoji,
      lat: s.lat,
      lon: s.lon,
      dist,
      walkMin,
      departures: s.stoptimesWithoutPatterns || []
    };
  });

  // sort by nearest
  stops.sort((a, b) => a.dist - b.dist);

  // take 5 nearest
  stops = stops.slice(0, 5);

  let html = "";

  stops.forEach(stop => {

    html += `
      <div style="padding:14px 0;border-bottom:1px solid #333;">
        <div style="display:flex;justify-content:space-between;align-items:center;">

          <div>
            <div style="font-size:1rem;font-weight:700;">
              ${stop.emoji} ${stop.name}
            </div>

            <div style="font-size:0.8rem;opacity:0.6;">
              ${Math.round(stop.dist)} m • ~${stop.walkMin} min walk
            </div>
          </div>

        </div>
    `;

    // show next 3 departures
    stop.departures.slice(0, 3).forEach(dep => {

      const departureMs =
        (dep.serviceDay * 1000) +
        (dep.realtimeDeparture * 1000);

      const minutes = Math.round((departureMs - now) / 60000);

      let label = "";
      let style = "";

      if (minutes <= 0) {
        label = "NOW";
        style = "color:#ff4d4d;font-weight:700";
      } else if (minutes <= 3) {
        label = "SOON";
        style = "color:#ffb020;font-weight:700";
      } else {
        label = `${minutes} min`;
      }

      html += `
        <div style="display:flex;justify-content:space-between;padding:2px 0;">
          <div>
            ${dep.trip.route.shortName} → ${dep.headsign}
          </div>
          <div style="${style}">
            ${label}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  });

  container.innerHTML = html;

  document.getElementById("status").innerText =
    "Nearby stops";
}</script>

</body>
</html>
