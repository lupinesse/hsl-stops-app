<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: system-ui;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      font-weight: bold;
    }

    .stop {
      background: var(--card);
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
    }

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://sweet-frost-f9aa.lupinesse.workers.dev";

function getLocation() {
  document.getElementById("status").innerText = "Getting location...";

  if (!navigator.geolocation) {
    document.getElementById("status").innerText = "Geolocation not supported";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      loadNearbyStops(pos.coords.latitude, pos.coords.longitude);
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function loadNearbyStops(lat, lon) {
  document.getElementById("status").innerText = "Loading stops...";

  const query = `
    query {
      nearest(
        lat: ${lat},
        lon: ${lon},
        first: 5,
        maxDistance: 600,
        filterByPlaceTypes: STOP
      ) {
        edges {
          node {
            place {
              ... on Stop {
                name
                stoptimesWithoutPatterns(numberOfDepartures: 6) {
                  serviceDay
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  `;

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });

    const data = await res.json();

    render(data.data.nearest.edges);

  } catch (e) {
    document.getElementById("status").innerText =
      "Failed to load data";
  }
}

function render(edges) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  const now = Date.now();

  let best = new Map();

  edges.forEach(edge => {
    const stop = edge.node.place;

    stop.stoptimesWithoutPatterns.forEach(dep => {

      const line = dep.trip.route.shortName;
      const direction = dep.headsign;

      const departureMs =
        (dep.serviceDay * 1000) +
        (dep.realtimeDeparture * 1000);

      const minutes = Math.round((departureMs - now) / 60000);

      const key = line + "→" + direction;

      // keep ONLY the soonest per line + direction
      if (!best.has(key) || best.get(key).minutes > minutes) {
        best.set(key, {
          stop: stop.name,
          line,
          direction,
          minutes
        });
      }
    });
  });

  // convert map → array and sort by soonest departure
  const sorted = Array.from(best.values())
    .sort((a, b) => a.minutes - b.minutes)
    .slice(0, 25);

  let html = "";

  sorted.forEach(d => {
    html += `
      <div class="stop">
        <div style="display:flex;justify-content:space-between;">
          <div>
            <b>${d.line}</b> → ${d.direction}
            <div style="font-size:0.85em;opacity:0.7">${d.stop}</div>
          </div>
          <div><b>${d.minutes <= 0 ? "Now" : d.minutes + " min"}</b></div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  document.getElementById("status").innerText = "Live (filtered directions)";
}</script>

</body>
</html>
