<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: system-ui;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      font-weight: bold;
    }

    .stop {
      background: var(--card);
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
    }

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://api.digitransit.fi/routing/v1/routers/hsl/index/graphql";

function getLocation() {
  if (!navigator.geolocation) {
    document.getElementById("status").innerText = "Geolocation not supported";
    return;
  }

  document.getElementById("status").innerText = "Requesting location...";

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      document.getElementById("status").innerText = "Loading stops...";

      const query = `
        query {
          nearest(lat: ${lat}, lon: ${lon}, first: 5, maxDistance: 800, filterByPlaceTypes: STOP) {
            edges {
              node {
                place {
                  ... on Stop {
                    name
                    stoptimesWithoutPatterns(numberOfDepartures: 5) {
                      headsign
                      realtimeDeparture
                      serviceDay
                      trip {
                        route {
                          shortName
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      `;

      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query })
      });

      const data = await res.json();

      const stops = data.data.nearest.edges;

      let html = "";

      stops.forEach(s => {
        const stop = s.node.place;

        html += `<div class="stop"><b>${stop.name}</b><br/>`;

        stop.stoptimesWithoutPatterns.slice(0, 3).forEach(dep => {
          html += `${dep.trip.route.shortName} → ${dep.headsign}<br/>`;
        });

        html += `</div>`;
      });

      document.getElementById("results").innerHTML = html;
      document.getElementById("status").innerText = "Done";
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    }
  );
}</script>

</body>
</html>
