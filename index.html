<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
  font-family: system-ui;
  background: #0b0f14;
  color: white;
}

.stop {
  padding: 12px 0;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #00d2ff;
  font-weight: 600;
}

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://sweet-frost-f9aa.lupinesse.workers.dev";

const homeLat = 60.1896;
const homeLon = 24.9542;

let state = {
  lat: null,
  lon: null,
  stops: [],
  lastData: []
};

function getLocation() {
  document.getElementById("status").innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;

      loadNearbyStops();
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    },
    { enableHighAccuracy: true }
  );
}

async function loadNearbyStops() {

  document.getElementById("status").innerText = "Loading stops...";

  const query = `
    query {
      nearest(
        lat: ${state.lat},
        lon: ${state.lon},
        first: 5,
        maxDistance: 600,
        filterByPlaceTypes: STOP
      ) {
        edges {
          node {
            place {
              ... on Stop {
                name
                lat
                lon
                stoptimesWithoutPatterns(numberOfDepartures: 6) {
                  serviceDay
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  `;

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query })
  });

  const data = await res.json();

  state.stops = data.data.nearest.edges;

  render();
}

function distance(lat1, lon1, lat2, lon2) {
  return Math.sqrt(
    Math.pow(lat1 - lat2, 2) + Math.pow(lon1 - lon2, 2)
  ) * 111000; // rough meters
}

function render() {
  const container = document.getElementById("results");
  container.innerHTML = "";

  const now = Date.now();

  let items = [];

  state.stops.forEach(edge => {
    const stop = edge.node.place;

    const dist = distance(
      state.lat,
      state.lon,
      stop.lat,
      stop.lon
    );

    stop.stoptimesWithoutPatterns.forEach(dep => {

      const departureMs =
        (dep.serviceDay * 1000) +
        (dep.realtimeDeparture * 1000);

      const minutes = Math.round((departureMs - now) / 60000);

      items.push({
        stop: stop.name,
        line: dep.trip.route.shortName,
        direction: dep.headsign,
        minutes,
        dist
      });
    });
  });

  // 🧠 sort by urgency first
  items.sort((a, b) => a.minutes - b.minutes);

  // 🧠 keep best per line+direction
  const best = new Map();

  items.forEach(i => {
    const key = i.line + "→" + i.direction;

    if (!best.has(key) || best.get(key).minutes > i.minutes) {
      best.set(key, i);
    }
  });

  const finalList = Array.from(best.values())
    .sort((a, b) => a.minutes - b.minutes)
    .slice(0, 20);

  let html = "";

  finalList.forEach(d => {

    let label = "";
    let color = "";

    if (d.minutes <= 0) {
      label = "NOW";
      color = "color:#ff4d4d;font-weight:700";
    } else if (d.minutes <= 3) {
      label = "SOON";
      color = "color:#ffb020;font-weight:700";
    } else {
      label = `${d.minutes} min`;
    }

    const walk = Math.round(d.dist / 80); // ~80m per min walk

    html += `
      <div class="stop" style="padding:12px 0;border-bottom:1px solid #333;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div><b>${d.line}</b> → ${d.direction}</div>
            <div style="font-size:0.75rem;opacity:0.6">
              ${d.stop} • ~${walk} min walk
            </div>
          </div>
          <div style="${color}">
            ${label}
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  document.getElementById("status").innerText = "Live transit view";
}

// 🔄 live refresh every 10 seconds
setInterval(() => {
  if (state.lat && state.lon) {
    loadNearbyStops();
  }
}, 10000);</script>

</body>
</html>
