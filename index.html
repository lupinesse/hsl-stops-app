<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
  font-family: system-ui;
  background: #0b0f14;
  color: white;
}

.stop {
  padding: 12px 0;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #00d2ff;
  font-weight: 600;
}

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://sweet-frost-f9aa.lupinesse.workers.dev";

const homeLat = 60.1896;
const homeLon = 24.9542;

let state = {
  lat: null,
  lon: null,
  stops: [],
  lastData: []
};

function getLocation() {
  document.getElementById("status").innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;

      loadNearbyStops();
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    },
    { enableHighAccuracy: true }
  );
}

async function loadNearbyStops() {

  document.getElementById("status").innerText = "Loading stops...";

  const query = `
    query {
      nearest(
        lat: ${state.lat},
        lon: ${state.lon},
        first: 5,
        maxDistance: 600,
        filterByPlaceTypes: STOP
      ) {
        edges {
          node {
            place {
              ... on Stop {
                name
                lat
                lon
                stoptimesWithoutPatterns(numberOfDepartures: 6) {
                  serviceDay
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  `;

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query })
  });

  const data = await res.json();

  state.stops = data.data.nearest.edges;

  render();
}

function distance(lat1, lon1, lat2, lon2) {
  return Math.sqrt(
    Math.pow(lat1 - lat2, 2) + Math.pow(lon1 - lon2, 2)
  ) * 111000; // rough meters
}

function render() {
  const container = document.getElementById("results");
  container.innerHTML = "";

  const now = Date.now();

  // build stop-based structure
  const stopsMap = new Map();

  state.stops.forEach(edge => {
    const stop = edge.node.place;

    const dist = Math.sqrt(
      Math.pow(state.lat - stop.lat, 2) +
      Math.pow(state.lon - stop.lon, 2)
    ) * 111000;

    if (!stopsMap.has(stop.name)) {
      stopsMap.set(stop.name, {
        stop,
        dist,
        departures: []
      });
    }

    const entry = stopsMap.get(stop.name);

    stop.stoptimesWithoutPatterns.forEach(dep => {

      const departureMs =
        (dep.serviceDay * 1000) +
        (dep.realtimeDeparture * 1000);

      const minutes = Math.round((departureMs - now) / 60000);

      entry.departures.push({
        line: dep.trip.route.shortName,
        direction: dep.headsign,
        minutes
      });
    });
  });

  // convert to array
  let stops = Array.from(stopsMap.values());

  // sort stops by nearest first (important UX decision)
  stops.sort((a, b) => a.dist - b.dist);

  let html = "";

  stops.forEach(s => {

    // keep only best departures per line at this stop
    const best = new Map();

    s.departures.forEach(d => {
      const key = d.line + "→" + d.direction;

      if (!best.has(key) || best.get(key).minutes > d.minutes) {
        best.set(key, d);
      }
    });

    const list = Array.from(best.values())
      .sort((a, b) => a.minutes - b.minutes)
      .slice(0, 5);

    if (list.length === 0) return;

    const walk = Math.round(s.dist / 80);

    html += `
      <div class="stop" style="padding:14px 0;border-bottom:1px solid #333;">
        <div style="margin-bottom:8px;">
          <b>${s.stop.name}</b>
          <div style="font-size:0.75rem;opacity:0.6">
            ~${walk} min walk
          </div>
        </div>
    `;

    list.forEach(d => {

      let label = "";
      let color = "";

      if (d.minutes <= 0) {
        label = "NOW";
        color = "color:#ff4d4d;font-weight:700";
      } else if (d.minutes <= 3) {
        label = "SOON";
        color = "color:#ffb020;font-weight:700";
      } else {
        label = `${d.minutes} min`;
      }

      html += `
        <div style="display:flex;justify-content:space-between;padding:2px 0;">
          <div>
            <b>${d.line}</b> → ${d.direction}
          </div>
          <div style="${color}">
            ${label}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
  document.getElementById("status").innerText = "Choose your stop";
}</script>

</body>
</html>
