<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
      margin: 0;
      font-family: system-ui;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      font-weight: bold;
    }

    .stop {
      background: var(--card);
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
    }

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://sweet-frost-f9aa.lupinesse.workers.dev";

function getLocation() {
  document.getElementById("status").innerText = "Getting location...";

  if (!navigator.geolocation) {
    document.getElementById("status").innerText = "Geolocation not supported";
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      loadNearbyStops(pos.coords.latitude, pos.coords.longitude);
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function loadNearbyStops(lat, lon) {
  document.getElementById("status").innerText = "Loading stops...";

  const query = `
    query {
      nearest(
        lat: ${lat},
        lon: ${lon},
        first: 5,
        maxDistance: 600,
        filterByPlaceTypes: STOP
      ) {
        edges {
          node {
            place {
              ... on Stop {
                name
                stoptimesWithoutPatterns(numberOfDepartures: 6) {
                  serviceDay
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  `;

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });

    const data = await res.json();

    render(data.data.nearest.edges);

  } catch (e) {
    document.getElementById("status").innerText =
      "Failed to load data";
  }
}

function render(edges) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  edges.forEach(edge => {
    const stop = edge.node.place;

    const lines = {};

    stop.stoptimesWithoutPatterns.forEach(dep => {
      const line = dep.trip.route.shortName;
      if (!lines[line]) lines[line] = [];
      lines[line].push(dep);
    });

    let html = `<div class="stop"><h2>${stop.name}</h2>`;

    Object.entries(lines).forEach(([line, deps]) => {

      deps.slice(0, 2).forEach(dep => {

        const departureMs =
          (dep.serviceDay + dep.realtimeDeparture) * 1000;

        const minutes = Math.round((departureMs - Date.now()) / 60000);

        html += `
          <div style="display:flex;justify-content:space-between;padding:4px 0;">
            <div><b>${line}</b> → ${dep.headsign}</div>
            <div>${minutes <= 0 ? "Now" : minutes + " min"}</div>
          </div>
        `;
      });
    });

    html += `</div>`;

    container.innerHTML += html;
  });

  document.getElementById("status").innerText = "Live nearby departures";
}</script>

</body>
</html>
