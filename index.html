<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
  font-family: system-ui;
  background: #0b0f14;
  color: white;
}

.stop {
  padding: 12px 0;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #00d2ff;
  font-weight: 600;
}

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://sweet-frost-f9aa.lupinesse.workers.dev";

setInterval(() => {
  if (typeof getLocation === "function") {
    getLocation();
  }
}, 15000);

function getLocation() {
  document.getElementById("status").innerText = "Getting location...";

  if (!navigator.geolocation) {
    document.getElementById("status").innerText = "Geolocation not supported";
    return;
  }

  navigator.geolocation.getCurrentPosition(
  (pos) => {
    window.__lastLat = pos.coords.latitude;
    window.__lastLon = pos.coords.longitude;

    loadNearbyStops(pos.coords.latitude, pos.coords.longitude);
  },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function loadNearbyStops(lat, lon) {
  document.getElementById("status").innerText = "Loading stops...";

  const query = `
    query {
      nearest(
        lat: ${lat},
        lon: ${lon},
        first: 5,
        maxDistance: 600,
        filterByPlaceTypes: STOP
      ) {
        edges {
          node {
            place {
              ... on Stop {
                name
                stoptimesWithoutPatterns(numberOfDepartures: 6) {
                  serviceDay
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  `;

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });

    const data = await res.json();

    render(data.data.nearest.edges);

  } catch (e) {
    document.getElementById("status").innerText =
      "Failed to load data";
  }
}

function render(edges) {
  const container = document.getElementById("results");
  container.innerHTML = "";

  const now = Date.now();

  // 🏠 HOME LOCATION (Valhallankatu 18)
  const homeLat = 60.1896;
  const homeLon = 24.9542;

  let best = new Map();

  // determine if user is near home
  let userLat, userLon;
  let nearHome = false;

  if (window.__lastLat && window.__lastLon) {
    userLat = window.__lastLat;
    userLon = window.__lastLon;

    const dist = Math.sqrt(
      Math.pow(userLat - homeLat, 2) +
      Math.pow(userLon - homeLon, 2)
    );

    // ~0.004 ≈ ~400–500m
    nearHome = dist < 0.004;
  }

  edges.forEach(edge => {
    const stop = edge.node.place;

    stop.stoptimesWithoutPatterns.forEach(dep => {

      const line = dep.trip.route.shortName;
      const direction = dep.headsign;

      const departureMs =
        (dep.serviceDay * 1000) +
        (dep.realtimeDeparture * 1000);

      const minutes = Math.round((departureMs - now) / 60000);

      const key = line + "→" + direction;

      let score = minutes;

      // 🧠 HOME BIAS LOGIC
      if (nearHome) {
        const d = direction.toLowerCase();

        const isCentre =
          d.includes("kamppi") ||
          d.includes("rautatie") ||
          d.includes("cent") ||
          d.includes("city");

        if (isCentre) score -= 5;
      }

      const existing = best.get(key);

      if (!existing || score < existing.score) {
        best.set(key, {
          stop: stop.name,
          line,
          direction,
          minutes,
          score
        });
      }
    });
  });

  const list = Array.from(best.values())
    .sort((a, b) => a.score - b.score)
    .slice(0, 20);

  let html = "";

  list.forEach(d => {

    let label = "";
    let style = "";

    if (d.minutes <= 0) {
      label = "NOW";
      style = "color:#ff4d4d;font-weight:700";
    } else if (d.minutes <= 3) {
      label = "SOON";
      style = "color:#ffb020;font-weight:700";
    } else {
      label = `${d.minutes} min`;
    }

    html += `
      <div class="stop" style="padding:12px 0;border-bottom:1px solid #333;">
        <div style="display:flex;justify-content:space-between;">
          <div>
            <b>${d.line}</b> → ${d.direction}
            <div style="font-size:0.8rem;opacity:0.6">${d.stop}</div>
          </div>
          <div style="${style}">
            ${label}
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  document.getElementById("status").innerText =
    nearHome ? "Home view (centre priority)" : "Normal view";
}</script>

</body>
</html>
