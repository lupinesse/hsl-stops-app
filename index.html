<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nearby HSL Stops</title>

  <meta name="theme-color" content="#0f172a" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00d2ff;
      --border: #334155;
    }

    body {
  font-family: system-ui;
  background: #0b0f14;
  color: white;
}

.stop {
  padding: 12px 0;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: #00d2ff;
  font-weight: 600;
}

    .muted {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <h1>Nearby HSL Stops</h1>

  <button onclick="getLocation()">Find Nearby Stops</button>

  <p class="muted" id="status">Waiting for location...</p>

  <div id="results"></div>

<script>
const API = "https://sweet-frost-f9aa.lupinesse.workers.dev";

const homeLat = 60.1896;
const homeLon = 24.9542;

let state = {
  lat: null,
  lon: null,
  stops: [],
  lastData: []
};

function getLocation() {
  document.getElementById("status").innerText = "Getting location...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.lat = pos.coords.latitude;
      state.lon = pos.coords.longitude;

      loadNearbyStops();
    },
    (err) => {
      document.getElementById("status").innerText =
        "Location error: " + err.message;
    },
    { enableHighAccuracy: true }
  );
}

async function loadNearbyStops() {

  document.getElementById("status").innerText = "Loading stops...";

  const query = `
    query {
      nearest(
        lat: ${state.lat},
        lon: ${state.lon},
        first: 5,
        maxDistance: 600,
        filterByPlaceTypes: STOP
      ) {
        edges {
          node {
            place {
              ... on Stop {
                name
                lat
                lon
                stoptimesWithoutPatterns(numberOfDepartures: 6) {
                  serviceDay
                  realtimeDeparture
                  headsign
                  trip {
                    route {
                      shortName
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  `;

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query })
  });

  const data = await res.json();

  state.stops = data.data.nearest.edges;

  render();
}

function distance(lat1, lon1, lat2, lon2) {
  return Math.sqrt(
    Math.pow(lat1 - lat2, 2) + Math.pow(lon1 - lon2, 2)
  ) * 111000; // rough meters
}

function render() {
  const container = document.getElementById("results");
  container.innerHTML = "";

  const now = Date.now();

  const scored = [];

  state.stops.forEach(edge => {
    const stop = edge.node.place;

    const dx = stop.lon - state.lon;
    const dy = stop.lat - state.lat;

    // simple bearing approximation
    const angle = Math.atan2(dy, dx) * (180 / Math.PI);

    const walkMinutes =
      Math.sqrt(Math.pow(dx, 2) + Math.pow(dy, 2)) * 111000 / 80;

    stop.stoptimesWithoutPatterns.forEach(dep => {

      const departureMs =
        (dep.serviceDay * 1000) +
        (dep.realtimeDeparture * 1000);

      const minutes = Math.round((departureMs - now) / 60000);

      const direction = dep.headsign.toLowerCase();

      // 🧭 arrow logic (simple but effective)
      let arrow = "→";

      if (Math.abs(angle) < 45) arrow = "→";
      else if (angle >= 45 && angle < 135) arrow = "↑";
      else if (angle <= -45 && angle > -135) arrow = "↓";
      else arrow = "←";

      // 🚦 side of street hint (heuristic)
      const side =
        angle > 0 ? "walk RIGHT side" : "walk LEFT side";

      scored.push({
        stop: stop.name,
        line: dep.trip.route.shortName,
        direction: dep.headsign,
        minutes,
        walkMinutes,
        arrow,
        side
      });
    });
  });

  // sort by best total time
  scored.sort((a, b) =>
    (a.minutes + a.walkMinutes) - (b.minutes + b.walkMinutes)
  );

  let html = "";

  scored.slice(0, 25).forEach(d => {

    let label = "";
    let color = "";

    if (d.minutes <= 0) {
      label = "NOW";
      color = "color:#ff4d4d;font-weight:700";
    } else if (d.minutes <= 3) {
      label = "SOON";
      color = "color:#ffb020;font-weight:700";
    } else {
      label = `${d.minutes} min`;
    }

    html += `
      <div class="stop" style="padding:14px 0;border-bottom:1px solid #333;">
        <div style="display:flex;justify-content:space-between;align-items:center;">

          <div>
            <div>
              <span style="font-size:1.2rem;margin-right:6px">${d.arrow}</span>
              <b>${d.line}</b> → ${d.direction}
            </div>

            <div style="font-size:0.75rem;opacity:0.6">
              ${d.stop} • ~${Math.round(d.walkMinutes)} min walk • ${d.side}
            </div>
          </div>

          <div style="${color}">
            ${label}
          </div>

        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  document.getElementById("status").innerText =
    "Directional transit view";
}</script>

</body>
</html>
